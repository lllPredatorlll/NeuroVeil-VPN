[package]
name = "neuroveil-vpn"
version = "1.0.2"
description = "NeuroVeil VPN Client (AmneziaWG 3.1, VLESS Reality & QUIC over sing-box)"
authors = ["vlad"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2.10", features = ["json", "native-tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
url = "2.5"
chrono = "0.4"
dirs = "5.0"
base64 = "0.22"
tauri-plugin-single-instance = "2.5.5"

[profile.dev]
strip = "symbols"

