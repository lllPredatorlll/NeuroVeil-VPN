name: Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or Update Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2050)"
          body: |
            ### NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2050)
            - **Исправление подключения на Android (кнопка «ПОДКЛЮЧИТЬ», оранжевое рукопожатие WireGuard и честный статус)**:
              - Устранена гонка между инстансами `NeuroVeilVpnService` в процессе `:vpn` (`coreExecutor`, `coreLock`, `commandServer`, `stopEpoch`, закрытие TUN-дескриптора и локального SOCKS-порта), из-за которой новое подключение не доходило до запуска ядра, а интерфейс преждевременно показывал «Подключено».
              - Исправлен конфликт локального порта `127.0.0.1:2081` (`bind: address already in use`) при повторном запуске или автопереподключении с автоматическим подбором свободного порта (`2081..2090`) и fallback-перезапуском TUN.
              - Возвращена оранжевая индикация «Установление рукопожатия...» для AmneziaWG/WireGuard на Android с активной проверкой прохождения трафика через туннель.
            - **Стабильная фоновая работа без самопроизвольных отключений на Android**:
              - Добавлены `WAKE_LOCK` и запрос исключения из оптимизации батареи (`REQUEST_IGNORE_BATTERY_OPTIMIZATIONS`) в интерфейсе и настройках, чтобы Android / One UI (Samsung) не «усыпляли» процесс `:vpn` в фоне.
              - Сетевой монитор больше не перезапускает сокеты `sing-box` при повторных событиях без реальной смены интерфейса.
            - **Кроссплатформенное автообновление**: Android автоматически обновляет `NeuroVeil-VPN-${{ steps.pkg.outputs.tag }}-arm64.apk`, Windows — `NeuroVeil.exe`.
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            NeuroVeil.exe
            NeuroVeil-VPN-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
