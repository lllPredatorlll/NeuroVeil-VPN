name: Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or Update Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2070)"
          body: |
            ### NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2070)
            - **Мгновенная отмена подключения, защита от зависания при старте и реальная смена портов на Android (`v2.0.7`)**:
              - **Кнопка подключения больше не блокируется**: окно начального ожидания `VpnBridgePlugin` снижено с `18 с` до `700 мс`, а кнопка питания во время запуска и рукопожатия позволяет сразу нажать **«ОТМЕНИТЬ»** и мгновенно остановить попытку подключения (`connectAttemptGenRef` + `disconnect_vpn`).
              - **Устранено зависание интерфейса и «сброс настроек» при запуске**: все Android Binder/ContentProvider IPC-вызовы вынесены из-под `Mutex<RuntimeState>` и защищены жёсткими таймаутами (`VpnStateProvider.callWithTimeout`), а загрузка профиля `get_app_state` при старте повторяется при временной задержке.
              - **Кнопки «Переподкл.» и «Автоподбор» теперь меняют порты сразу**: кнопки активны уже во время запуска/рукопожатия, ротация портов работает как для `ListenPort` (AmneziaWG/WireGuard), так и для диапазона `hop_ports` (Hysteria 2), новый порт сразу отображается в интерфейсе и карточке профиля, а автоподбор корректно ждёт запуск службы перед проверкой рукопожатия.
            - **Стабильная фоновая работа и автообновление**: Android обновляет `NeuroVeil-VPN-${{ steps.pkg.outputs.tag }}-arm64.apk`, Windows — `NeuroVeil.exe` (плюс доступен NSIS-установщик для Windows).
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            NeuroVeil.exe
            NeuroVeil-VPN-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
