name: Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or Update Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2060)"
          body: |
            ### NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2060)
            - **Исправление подключения под блокировками DPI на Android (`v2.0.6`)**:
              - **Убраны гонки запуска и перезапуска VPN-ядра**: `connect_vpn` на Android больше не вызывает лишний `stop_vpn`/`stopSelf()` перед запуском, а закрытие `activeTunFd` выполняется до `commandServer.closeService()`, поэтому переподключение и смена порта больше не зависают под блокировками DPI.
              - **Честное оранжевое рукопожатие (`tunnelRxConfirmed`)**: статус рукопожатия больше не сбрасывается ложными байтами процесса (`TrafficStats.getUidRxBytes`), а снимается только после подтверждения входящего трафика через сам TUN-туннель (`CommandClient`).
              - **Активная оранжевая кнопка + «Переподкл.» и «Автоподбор» всегда под рукой**: добавлено состояние `is_connecting`, убрано вводящее в заблуждение сообщение «Ожидание подтверждения от системы», кнопка не сбрасывается в серый вид при долгом старте, а кнопки **«Переподкл.»** и **«Автоподбор»** доступны сразу во время подключения и рукопожатия.
              - **Ускорен локальный DNS-транспорт**: сокращён таймаут ожидания системного резолвера (`10с → 4с`) и убраны искусственные задержки `1200 мс` при подборе локального порта.
            - **Стабильная фоновая работа и автообновление**: Android обновляет `NeuroVeil-VPN-${{ steps.pkg.outputs.tag }}-arm64.apk`, Windows — `NeuroVeil.exe` (плюс доступен NSIS-установщик для Windows).
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            NeuroVeil.exe
            NeuroVeil-VPN-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
