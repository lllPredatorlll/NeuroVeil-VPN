name: Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or Update Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2210)"
          body: |
            ### NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2210)
            - **Новый логотип NeuroVeil VPN** для Windows и Android (иконки приложения, системного трея и лаунчера).
            - **Режим «Каскад» (2-Hop) и автодеплой пары VPS**:
              - Полноценный 2-Hop каскад (Входной мост → Выходной сервер) с сохранением связок, проверкой пинга и быстрым переключением.
              - В разделе Автодеплой добавлены **«Деплой моста (2 VPS)»** (автонастройка сразу пары серверов по SSH) и **«Управление каскадом»**.
              - Вкладка **«Добавление конфигов»** внутри Каскада — генерация готовых клиентских конфигов (роутер, ТВ, смартфон) для работы через каскад.
            - **Протокол Enigma v1 (Rotor .nvkey)**: встроенный полиморфный 1-RTT протокол поверх WireGuard с мимикрией заголовков и поддержкой ключ-книг `.nvkey`.
            - **Обновлённый интерфейс раздельного туннелирования**:
              - Компактный переключатель раздельного туннелирования.
              - Компактная кнопка `+` сразу справа от предустановок маршрутизации.
              - Кнопка **«Применить»** перенесена вниз рядом со **«Сбросить пресеты»** + добавлено подтверждение сброса.
              - Увеличена высота окна ПК-клиента (+10%) для более удобной навигации.
            - **Исправлен автозапуск и приоритет в Windows**:
              - Автоматическая синхронизация задачи `NeuroVeil` в Планировщике задач Windows с повышенным приоритетом (`AboveNormal`), `HighestAvailable`, без лимита времени работы и с корректной рабочей директорией.
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            NeuroVeil.exe
            NeuroVeil-VPN-*.apk
            NeuroVeil-VPN-*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
