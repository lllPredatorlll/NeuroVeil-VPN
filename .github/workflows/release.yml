name: Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or Update Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2220)"
          body: |
            ### NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2220)
            - **Исправлен DNS в режиме раздельного туннелирования (`sing-box 1.14`)**:
              - Все `ip_cidr`-правила (Telegram/Discord и пользовательские IP) вынесены из DNS-рулсетов в отдельные route-only рулсеты (`rules_*_ip.json`).
              - Устранены ошибки `dns: rejected` и предупреждения `Legacy Address Filter Fields` при подключении с раздельным туннелированием (включая онлайн-игры и протокол Enigma).
            - **Метрики трафика и скорости только через туннель**:
              - Входящая/исходящая скорость и общий объём трафика теперь считаются только для соединений, проходящих через VPN-туннель (без учёта `direct`, `block` и `dns-out`).
            - **Расширен буфер журнала с 250 до 2000 записей**:
              - Увеличен лимит журнала в ПК-клиенте и Android-сервисе (`NeuroVeilVpnService`), добавлен живой счётчик записей в интерфейсе.
            - **Улучшения гибридного режима AWG + Reality**:
              - Добавлена настройка `"mtu": 1280` для серверного `awg-in` при автодеплое и диагностика зависания на 16 КБ (ТСПУ).
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            NeuroVeil.exe
            NeuroVeil-VPN-*.apk
            NeuroVeil-VPN-*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
