name: Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or Update Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2080)"
          body: |
            ### NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2080)
            - **Лёгкий фоновый анти-слип для VPS (`v2.0.8`)**:
              - **Фоновая служба `neuroveil-antisleep` на VPS**: каждые 35 секунд поддерживает тёплое состояние сетевого шлюза (ARP/vSwitch), UDP NAT/Anti-DDoS таблицы и удерживает процессы `sing-box` в горячей RAM (`vm.swappiness=1`, `OOMScoreAdjust=-900`, `nf_conntrack_udp_timeout`), не создавая мусора в логах.
              - **Автоматически при деплое + кнопка для существующих VPS**: новые серверы получают анти-слип сразу при установке, а для уже развёрнутых VPS в панели **«Управление VPS»** добавлен переключатель **«Анти-слип: ВКЛ / ВЫКЛ»** в 1 клик.
            - **Включает все исправления `v2.0.7` для Android и Windows**: мгновенная отмена подключения, защита от зависания/сброса при старте и смена портов кнопками «Переподкл.» / «Автоподбор».
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            NeuroVeil.exe
            NeuroVeil-VPN-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
