name: Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or Update Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2030)"
          body: |
            ### NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2030)
            - **Официальный Android-клиент (ARM64 APK)**: добавлена полноценная сборка `NeuroVeil-VPN-${{ steps.pkg.outputs.tag }}-arm64.apk` в релизы GitHub с адаптивным мобильным интерфейсом и единым ядром подключения.
            - **Кроссплатформенное автообновление (APK для Android / EXE для ПК)**:
              - На **Android** центр обновлений автоматически выбирает `.apk`-файл релиза, загружает его в защищённый кэш приложения и запускает системный установщик Android (`FileProvider` + `REQUEST_INSTALL_PACKAGES`).
              - На **Windows (ПК)** клиент автоматически выбирает `NeuroVeil.exe`, загружает новую версию и выполняет бесшовное самообновление с перезапуском.
            - **Плитка быстрых настроек Android (Quick Settings Tile)**: добавлена кнопка быстрого включения/отключения VPN в верхней шторке Android с синхронизацией выбранного туннеля, без вылетов при нажатии и с актуальным статусом активности.
            - **Исправление индикатора VPN и трафика на Android**: корректное освобождение TUN-дескриптора при отключении (значок ключа в строке состояния сразу пропадает без закрытия приложения), тихий канал уведомлений без лишних баннеров и работающие счётчики входящего/исходящего трафика.
            - **Обновлённый фирменный логотип NV и монохромная иконка**: новая иконка **NV** без серого фона для Windows, лаунчера Android и трея, а также отдельная монохромная иконка для шторки быстрых настроек.
            - **Стабильность ядра `libbox` / `sing-box` и изоляция данных**: устранена ошибка `clash-server: clash api is not included in this build` при запуске туннелей на Android, отключён Android Auto Backup (удалённые данные и туннели не возвращаются после переустановки) и улучшена работа гибридных конфигураций.
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            NeuroVeil.exe
            NeuroVeil-VPN-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
