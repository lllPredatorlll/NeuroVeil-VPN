name: Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or Update Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2040)"
          body: |
            ### NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2040)
            - **Удержание VPN в фоне после закрытия клиента из диспетчера задач (Android)**:
              - Выделенный процесс `:vpn` (`NeuroVeilVpnService`, `NeuroVeilTileService`, `VpnStateProvider`) с `android:stopWithTask="false"` и `START_STICKY` — закрытие окна приложения из списка недавних задач больше не разрывает туннель.
              - При повторном открытии интерфейса статус подключения, выбранный профиль и счётчики трафика автоматически синхронизируются с работающим фоновым туннелем без переподключения.
            - **Официальный Android-клиент (ARM64 APK) и кроссплатформенное автообновление**:
              - На **Android** центр обновлений автоматически скачивает `NeuroVeil-VPN-${{ steps.pkg.outputs.tag }}-arm64.apk` в защищённый кэш и запускает системный установщик.
              - На **Windows (ПК)** клиент автоматически скачивает и обновляет `NeuroVeil.exe` с автоперезапуском.
            - **Плитка быстрых настроек, иконки NV и стабильность ядра**: быстрая кнопка в шторке Android, мгновенное снятие значка ключа при явном отключении, тихий канал уведомлений, счётчики трафика и новый логотип **NV**.
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            NeuroVeil.exe
            NeuroVeil-VPN-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
