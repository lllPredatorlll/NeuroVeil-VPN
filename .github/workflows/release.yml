name: Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or Update Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2001)"
          body: |
            ### NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2001)
            - **Новый интерфейс NeuroVeil VPN 2.0**: компактное окно без системных рамок с масштабированием под разрешение экрана, плавное выделение активного раздела в боковой панели, мягкое размытие краёв функциональных блоков и **12 тем оформления**.
            - **Мульти-протокольное управление VPS**: создание мульти-контейнеров на сервере и пакетный выпуск клиентских ключей сразу по нескольким выбранным протоколам.
            - **Обновлённые карточки туннелей и выбора протокола**: цветовая идентификация каждого протокола (с градиентами для гибридов), описания протоколов, подсветка выбранного туннеля и улучшенный макет кнопок.
            - **Полный стек протоколов и гибридов**:
              - **AmneziaWG 3.1 / 2.0**: шифрование заголовков (HPK), 32-битные `H1–H4`, неколлидирующие `S1–S4`.
              - **AWG + QUIC Pre-Warm (`awgquic://`)** и **Гибрид AWG + VLESS Reality (`awgvless://`)**.
              - **VLESS Reality**, **ShadowTLS v3**, **Cloudflare CDN WS (`vless_ws`)**, **WebRTC Steganography**, **Hysteria 2**, **TUIC v5**, **Shadowsocks 2022**, **WireGuard** и **SSH-туннель**.
            - **Раздельное туннелирование «На лету»**: пресеты, белый/чёрный списки программ, доменов и IP/CIDR с полной адаптацией контрастности под все светлые и тёмные темы.
            - **Резервное копирование и сброс настроек**: экспорт/восстановление профилей, правил и параметров в файл и полный сброс до заводских настроек.
            - **Безопасность и стабильность**: Auto Port Hunt, Kill Switch, защита от утечек DNS (DoH) и IPv6, центр обновлений.
          draft: false
          prerelease: false
          files: |
            NeuroVeil.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
