name: Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or Update Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 1058)"
          body: |
            ### NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 1058)
            - **Новые специальные протоколы защиты рукопожатия (Anti-DPI / ТСПУ)**:
              - **AWG + QUIC Pre-Warm (`awgquic://`)**: предварительный «прогрев» локального UDP-порта мимикрия-пакетами WebRTC STUN Binding Request (RFC 5389) и QUIC v1 Initial (RFC 9000) за 15 мс до рукопожатия AmneziaWG.
              - **Гибрид AWG + VLESS Reality (`awgvless://`)**: полная инкапсуляция рукопожатия и трафика AmneziaWG / WireGuard внутри TLS 1.3 туннеля VLESS Reality (TCP 443, `xtls-rprx-vision`, `xudp`).
            - **Усиленная рандомизация AmneziaWG 3.1**: генерация настоящих 32-битных заголовков `H1–H4` (`100_000_000..2_140_000_000`) и неколлидирующих размеров `S1/S2` (`148 + S1 ≠ 92 + S2`).
            - **Автоподбор порта (Auto Port Hunt)**: новая кнопка **«Автоподбор»** на главной панели для автоматического перебора локальных UDP-портов до успешного рукопожатия.
            - **Авторазвёртывание на VPS в 1 клик**: поддержка автоматического создания профилей `AWG + QUIC Pre-Warm` и `Гибрид AWG + VLESS Reality` при настройке сервера.
            - **Поддержка всех протоколов**: AmneziaWG 3.1 / 2.0, AWG + QUIC Pre-Warm, Гибрид AWG + Reality, WireGuard, VLESS Reality, ShadowTLS v3, VLESS-WS (CDN Shield), WebRTC Steganography, Hysteria 2, TUIC v5, Shadowsocks и SSH-туннель.
            - **Автоматическое обновление**: бесшовное обновление через встроенный Центр обновлений приложения.
          draft: false
          prerelease: false
          files: |
            NeuroVeil.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

