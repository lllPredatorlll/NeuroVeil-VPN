name: Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or Update Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2020)"
          body: |
            ### NeuroVeil VPN ${{ steps.pkg.outputs.tag }} (Build 2020)
            - **9 современных тем оформления + Pure AMOLED Black**: новые тёмные (Obsidian Cyan, Pure AMOLED Black, Carbon Emerald, Graphite Violet, Onyx Crimson, Basalt Amber) и светлые (Alabaster Azure, Pearl Violet, Porcelain Emerald) темы с мягкими цветовыми акцентами, применяемыми ко всем свечениям, переключателям, ползункам и активным карточкам (при этом главная кнопка подключения всегда окрашивается в цвет выбранного протокола).
            - **Динамическая кнопка подключения по цвету протокола**: кнопка «ПОДКЛЮЧИТЬ / ОТКЛЮЧИТЬ» и её свечение автоматически принимают цвет (или градиент для гибридов `awgquic` / `awgvless`) выбранного протокола.
            - **Бесшовная боковая панель и улучшенный UI**: увеличено скругление выделения активной вкладки, убрано наложение границ, удалён лишний значок «+» на иконке VPS, уменьшено чрезмерное размытие краёв блоков, компактные карточки безопасности, автозапуска, языков и тем; убраны лишние пункты DNS и локального порта из настроек; цветные карточки всех 4 действий в разделе «Добавление и Автодеплой».
            - **Визуальное выделение режимов**: внешнее свечение активных режимов раздельного туннелирования и работы сети, переработанный мастер-переключатель без сильного размытия.
            - **Отключено системное контекстное меню браузера**: правый клик по интерфейсу больше не вызывает стандартное меню WebView2 (кроме полей ввода текста).
            - **Мульти-протокольное управление VPS и стек 2.0**: пакетный деплой и выпуск ключей, AmneziaWG 3.1 / 2.0, AWG + QUIC Pre-Warm (`awgquic://`), Гибрид AWG + VLESS Reality (`awgvless://`), VLESS Reality, ShadowTLS v3, Cloudflare CDN WS, WebRTC Steganography, Hysteria 2, TUIC v5, Shadowsocks 2022, WireGuard, SSH-туннель, раздельное туннелирование, резервное копирование и Auto Port Hunt.
          draft: false
          prerelease: false
          files: |
            NeuroVeil.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
